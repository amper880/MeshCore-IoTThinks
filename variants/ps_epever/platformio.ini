;
; Epever module: Epever Tracer AN charge controller over RS-485 (Modbus RTU)
; in repeater / room server telemetry, plus `get sensors` / `get|set epever`.
; SHT40 and INA3221 come from the common sensor list (sensor_base).
;
; The [epever_*] sections hold the module flags and the board pins; the
; observer-combined builds (variants/ps_epever_observer) reuse them.
; Wiring and CLI: docs/epever.md
;

[epever]
build_flags =
  -D ENV_INCLUDE_EPEVER=1
  -D EPEVER_BAUD=115200
  -D EPEVER_UNIT_ID=1
  -D EPEVER_CACHE_MS=30000

; Heltec V3 / V4: UART2, TX GPIO40 -> module DI, RX GPIO41 <- module RO (GPS keeps UART1).
; I2C sensors on a second bus, GPIO6 = SDA, GPIO4 = SCL (the OLED bus is not on the header).
[epever_heltec_v3_v4]
build_flags =
  ${epever.build_flags}
  -D ENV_PIN_SDA=6
  -D ENV_PIN_SCL=4
  -D EPEVER_SERIAL=Serial2
  -D EPEVER_PIN_TX=40
  -D EPEVER_PIN_RX=41

; Heltec T114: UARTE1 (Serial2), TX P0.28 -> DI, RX P0.29 <- RO (GPS keeps Serial1).
; I2C sensors on Wire1 (the board's I2C header).
[epever_t114]
build_flags =
  ${epever.build_flags}
  -D EPEVER_SERIAL=Serial2
  -D EPEVER_PIN_TX=28
  -D EPEVER_PIN_RX=29

; RAK4631 / RAK3401 (WisMesh 1W Booster): Serial1, TX P0.16 (TXD1) -> DI,
; RX P0.15 (RXD1) <- RO, or a RAK5802 in the IO slot. It is the GPS slot's
; UART, so these builds have no GPS.
[epever_rak]
build_flags =
  ${epever.build_flags}
  -UENV_INCLUDE_GPS
  -D EPEVER_SERIAL=Serial1
  -D EPEVER_PIN_TX=16
  -D EPEVER_PIN_RX=15

; ----------------- Repeaters with the Epever module -----------------

[env:Heltec_v3_repeater_epever]
extends = Heltec_lora32_v3
build_flags =
  ${Heltec_lora32_v3.build_flags}
  ${epever_heltec_v3_v4.build_flags}
  -D DISPLAY_CLASS=SSD1306Display
  -D ADVERT_NAME='"Heltec Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
build_src_filter = ${Heltec_lora32_v3.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<../examples/simple_repeater>
lib_deps =
  ${Heltec_lora32_v3.lib_deps}
  ${esp32_ota.lib_deps}
  bakercp/CRC32 @ ^2.0.0

[env:heltec_v4_repeater_epever]
extends = heltec_v4_oled
build_flags =
  ${heltec_v4_oled.build_flags}
  ${epever_heltec_v3_v4.build_flags}
  -D DISPLAY_CLASS=SSD1306Display
  -D ADVERT_NAME='"Heltec Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
build_src_filter = ${heltec_v4_oled.build_src_filter}
