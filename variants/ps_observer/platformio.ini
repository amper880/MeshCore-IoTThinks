;
; Packet observer module for PowerSaving repeaters:
;   - ESP32 (Heltec V3, V4): WiFi + MQTT uplink, `get|set uplink.*`
;   - nRF52 (T114, RAK4631, RAK3401): packet lines on the USB serial port in the
;     MESH_PACKET_LOGGING format (meshcoretomqtt), `get|set observer.serial`
;
; The [observer_*] sections hold the module flags; the Epever-combined builds
; (variants/ps_epever_observer) reuse them.
; Setup and CLI: docs/observer.md
;

[observer_uplink]
build_flags =
  -D WITH_MQTT_UPLINK=1
build_src_filter =
  +<helpers/esp32/MqttUplink.cpp>
lib_deps =
  knolleary/PubSubClient @ ^2.8

[observer_serial]
build_flags =
  -D WITH_SERIAL_OBSERVER=1
  -D MESH_PACKET_LOGGING=1

; ----------------- Repeaters with the observer module -----------------

[env:Heltec_v3_repeater_observer]
extends = Heltec_lora32_v3
build_flags =
  ${Heltec_lora32_v3.build_flags}
  ${observer_uplink.build_flags}
  -D DISPLAY_CLASS=SSD1306Display
  -D ADVERT_NAME='"Heltec Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
build_src_filter = ${Heltec_lora32_v3.build_src_filter}
  ${observer_uplink.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<../examples/simple_repeater>
lib_deps =
  ${Heltec_lora32_v3.lib_deps}
  ${esp32_ota.lib_deps}
  ${observer_uplink.lib_deps}
  bakercp/CRC32 @ ^2.0.0

