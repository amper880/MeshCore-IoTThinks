;
; PowerSaving repeaters with both modules:
;   Epever (variants/ps_epever, docs/epever.md) + packet observer
;   (variants/ps_observer, docs/observer.md).
; ESP32 boards observe over WiFi/MQTT, nRF52 boards over USB serial.
; Each module can still be switched at runtime: `set epever on|off`,
; `set uplink.enable on|off`, `set observer.serial on|off`.
;

[env:Heltec_v3_repeater_epever_observer]
extends = Heltec_lora32_v3
build_flags =
  ${Heltec_lora32_v3.build_flags}
  ${epever_heltec_v3_v4.build_flags}
  ${observer_uplink.build_flags}
  -D DISPLAY_CLASS=SSD1306Display
  -D ADVERT_NAME='"Heltec Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
build_src_filter = ${Heltec_lora32_v3.build_src_filter}
  ${observer_uplink.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<../examples/simple_repeater>
lib_deps =
  ${Heltec_lora32_v3.lib_deps}
  ${esp32_ota.lib_deps}
  ${observer_uplink.lib_deps}
  bakercp/CRC32 @ ^2.0.0

